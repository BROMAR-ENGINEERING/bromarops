<!--
  BROMAR OPS — MAIN SHELL
  V1.21
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bromar Ops</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16"   href="assets/icons/graphite-16.png">
  <link rel="icon" type="image/png" sizes="32x32"   href="assets/icons/graphite-32.png">
  <link rel="icon" type="image/png" sizes="72x72"   href="assets/icons/graphite-72.png">
  <link rel="icon" type="image/png" sizes="96x96"   href="assets/icons/graphite-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="assets/icons/graphite-128.png">
  <link rel="icon" type="image/png" sizes="144x144" href="assets/icons/graphite-144.png">
  <link rel="apple-touch-icon"      sizes="152x152" href="assets/icons/graphite-152.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/graphite-192.png">
  <link rel="icon" type="image/png" sizes="384x384" href="assets/icons/graphite-384.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bromar Ops">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- ══════════════════════════════════════════════════════════════
       Config, auth, utilities, report kit — REQUIRED for the app.
       If any of these fail, the app cannot boot.
       ══════════════════════════════════════════════════════════════ -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/bromar-report-kit.js"></script>

  <!-- ══════════════════════════════════════════════════════════════
       Page modules — each guarded with onerror. A missing file will
       log a warning and skip that page but the app keeps booting.
       ══════════════════════════════════════════════════════════════ -->
  <script>
    (function loadPages() {
      const files = [
        'js/pages/dashboard.js',
        'js/pages/jobs.js',
        'js/pages/quotes.js',
        'js/pages/scheduling.js',
        'js/pages/timesheets.js',
        'js/pages/employees.js',
        'js/pages/ims.js',
        'js/pages/ims/ims-quality-itc-builder.js',
        'js/pages/ims/ims-safety-approved-swms.js',
        'js/pages/fleet.js',
        'js/pages/equipment.js',
        'js/pages/clients.js',
        'js/pages/tasks.js',
        'js/pages/materials.js',
        'js/pages/admin.js',
        'js/pages/testtag.js',
        'js/pages/_components.js'
      ];
      files.forEach((src) => {
        const s = document.createElement('script');
        s.src = src;
        // Synchronous load order preserved: async=false keeps DOM parse
        // order for scripts inserted this way.
        s.async = false;
        s.onerror = () => console.warn('[shell] optional module missing:', src);
        document.body.appendChild(s);
      });
    })();
  </script>

  <!-- Core last: initialises the SPA after auth is ready -->
  <script src="js/core.js"></script>

  <!-- PWA service worker registration + iOS gesture block -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
  </script>
</body>
</html>
